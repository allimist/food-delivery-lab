# Project name fixes container/volume names regardless of the folder name.
# Host ports are offset from the other labs (hotel 3010/5173/5433/6379/8080, flight 3020/5174/5435/6380/8081,
# dating 3050/5177/5437) so they can all run side by side. WEB_PORT and API_PORT move the two you open in a browser.
name: food-delivery-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
      POSTGRES_DB: food
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-200mb}", "--maxmemory-policy", "noeviction"]
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    # Official Apache image (KRaft, single node). Not published on the host: the hotel lab already uses 9092.
    image: apache/kafka:3.9.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xmx256m

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started   # the outbox holds events until Kafka is reachable
    ports:
      - "${API_PORT:-3030}:3030"
    environment:
      PORT: 3030
      DATABASE_URL: postgresql://food:food@postgres:5432/food
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-learning-secret
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5175}
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      TIME_SCALE: ${TIME_SCALE:-20}
      COURIER_KMH: 25
      DISPATCH_TIMEOUT_S: ${DISPATCH_TIMEOUT_S:-90}   # real seconds = 30 lab minutes at TIME_SCALE 20
      RESTAURANT_TIMEOUT_S: 60
      SIM_ONLINE_DEFAULT: 20

  # 40 simulated couriers riding around Bangkok through the public API.
  courier-sim:
    build: ./apps/courier-sim
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:3030/api
      SIM_COURIERS: 40

  web:
    build: ./apps/web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5175}:5175"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3030}/api
      VITE_KAFKA_UI_URL: http://localhost:8082
      VITE_POSTGRES: "localhost:5436 (user/db/password: food)"
      VITE_REDIS: redis://localhost:6381

volumes:
  postgres_data:
