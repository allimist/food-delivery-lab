name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, courier-sim, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build

  smoke:
    name: End-to-end smoke test (every saga path)
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      DISPATCH_TIMEOUT_S: 30   # keeps the "no courier" path short
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build postgres redis kafka api courier-sim
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 api courier-sim kafka
      - name: Stop
        if: always()
        run: docker compose down -v
